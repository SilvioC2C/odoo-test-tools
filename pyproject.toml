[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-test-tools"
version = "0.0.1"
description = "Local Odoo multirepo dev environment manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "packaging>=23.0",
    "rich>=13.7.0",
]
license = { text = "LGPL-3.0-or-later" }

[project.scripts]
odoo-test-tools = "odoo_test_tools.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_test_tools*"]
exclude = ["tests*"]
